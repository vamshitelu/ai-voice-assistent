[project]
name = "voice-assistent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vamshitelu", email = "vamshi.telu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "edge-tts>=7.3.1",
    "fastapi>=0.162.0",
    "groq>=1.7.0",
    "openai>=3.42.0",
    "pygame>=2.6.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
voice-assistent = "voice_assistent:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
